# Three installers from three machines.
#
# jpackage only ever builds for the platform it runs on, so the matrix is not a
# convenience here - it is the only way to get a .dmg, a .msi and a .deb out of
# one repository.
name: Installers

on:
  # A tag is the usual way in. The input is for the other case: the installers
  # for a release have to be built again without the tag moving - a fix to this
  # file, a runner that went away - and a tag that has already been handed out
  # should not be repointed to make that happen.
  workflow_dispatch:
    inputs:
      release:
        description: 'Hang the installers on this release, e.g. v1.0.0 (blank: just build)'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # Two Macs, because jpackage builds for the chip it runs on and an arm64
        # bundle will not start on an Intel Mac at all - Rosetta translates the
        # other way. macos-latest is Apple Silicon, macos-15-intel is the Intel
        # one - macos-13, the old Intel image, has been retired and a job asking
        # for it now simply queues for ever.
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    # so a tagged build can hang its installer on the release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The tag is what the version is: v1.1.0 has to produce installers that
      # call themselves 1.1.0, or the file a player downloads argues with the
      # page it came from. Both packaging scripts already read VERSION from here.
      - name: Version from the tag
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          tag="$RELEASE"
          case "$GITHUB_REF" in refs/tags/v*) tag="${GITHUB_REF#refs/tags/}" ;; esac

          if [ -n "$tag" ]; then
            echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      # The anon key is public by design - the website hands it to every visitor
      # - but it is not in the repository, so the build takes it from the repo's
      # secrets. Without it the game still builds and plays; it just has no
      # accounts and no cloud saves.
      - name: Supabase keys
        shell: bash
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            printf 'url=%s\nanonKey=%s\n' \
              "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_ANON_KEY }}" \
              > src/main/resources/com/example/demo/supabase.properties
          else
            echo "no Supabase secrets set - building without accounts"
          fi

      - name: WiX (Windows installers need it)
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y

      - name: Build the installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./packaging/package.sh
          ./packaging/package.sh

      # cmd, not bash: bash eats the backslash in the path and goes looking for
      # a command called "packagingpackage.bat"
      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: packaging\package.bat

      # ... which means two files called the same thing, and the second upload
      # would quietly stand on the first. The chip goes in the name.
      - name: Say which chip the Mac build is for
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chip=$(uname -m)
          for dmg in target/installer/*.dmg; do
            mv "$dmg" "${dmg%.dmg}-$chip.dmg"
          done
          ls -l target/installer

      # The version comes out of jpackage in the file name, and the download
      # page cannot use a name that changes: GitHub serves the newest release's
      # file at /releases/latest/download/<name>, which only works while <name>
      # stays the same. So the version is dropped here. It is not lost - the
      # release says it, and so does the game once installed.
      - name: Name the files what the site asks for
        shell: bash
        run: |
          cd target/installer
          for f in *; do
            case "$f" in
              *.msi)       new=Fityesz-Kronika-Windows.msi ;;
              *arm64.dmg)  new=Fityesz-Kronika-macOS-AppleSilicon.dmg ;;
              *x86_64.dmg) new=Fityesz-Kronika-macOS-Intel.dmg ;;
              *.deb)       new=fityesz-kronika-linux-amd64.deb ;;
              *) continue ;;
            esac
            [ "$f" = "$new" ] || mv "$f" "$new"
          done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: fityesz-kronika-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/installer/*
          if-no-files-found: error

      # A build artifact needs a GitHub account to download and is thrown away
      # after ninety days, so it is no use to a page that says "download the
      # game". On a tag the installer goes onto the release instead, where the
      # link is permanent and public. The release is made before the tag is
      # pushed, so all three machines only ever upload to one that is already
      # there.
      - name: Hang it on the release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" target/installer/* --clobber
